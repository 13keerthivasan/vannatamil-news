/* keep the section nav on exactly one line, whatever the font metrics turn out to be */
function fitNav(){
 const n=$("#nav"); if(!n||!n.children.length)return;
 const cs=getComputedStyle(n);
 const avail=n.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
 if(avail<=0)return;
 const used=()=>Array.prototype.reduce.call(n.children,(a,el)=>a+el.getBoundingClientRect().width,0);
 let fs=16,guard=0;
 n.style.setProperty("--navfs",fs+"px");
 while(used()>avail-2&&fs>12&&guard++<24){fs-=.5;n.style.setProperty("--navfs",fs+"px")}
}

/* ═══════════ ROUTER ═══════════ */
function route(){
 const raw=(location.hash||"").replace(/^#/,"")||"/";
 const qi=raw.indexOf("?"), path=qi<0?raw:raw.slice(0,qi), qs=qi<0?"":raw.slice(qi+1);
 const p=path.split("/").filter(Boolean);
 let html,mark="";
 switch(p[0]){
  case undefined: html=V.home();mark="/";break;
  case "category": html=V.category(p[1]);mark="/category/"+p[1];break;
  case "story": html=V.story(p[1]);break;
  case "videos": VIDPAGE.n=24; html=V.videos();mark="/videos";break;
  case "video": html=V.video(p[1]);break;
  case "live": html=V.live();mark="/live";break;
  case "epaper": html=V.epaper();mark="/epaper";break;
  case "social": html=V.social();break;
  case "about": html=V.about();break;
  case "advertise": html=V.advertise();break;
  case "contact": html=V.contact();break;
  case "privacy": html=V.privacy();break;
  case "terms": html=V.terms();break;
  case "search": html=V.search(decodeURIComponent(new URLSearchParams(qs).get("q")||""));break;
  case "admin":
   if(SB.ready()&&SB.token&&SB.isStaff()&&!ADM.loaded){
    html=`<div class="wrap"><div class="adm"><div class="note">${esc(t("loading"))}</div></div></div>`;
    refreshAdmin().then(()=>route());
   }else html=V.admin(p[1],p[2]);
   break;
  default: html=V.notfound();
 }
 $("#view").innerHTML=html;
 document.querySelectorAll(".navl").forEach(a=>a.classList.toggle("on",a.dataset.r===mark));
 closeDrawer();
 window.scrollTo(0,0);
 const sc=$("#socialcards"); if(sc)sc.innerHTML=followCards();
 if($("#view .adm"))bindAdmin();
 const st=$("#stabs");
 if(st)st.addEventListener("click",e=>{
  const b=e.target.closest(".stab"); if(!b)return;
  st.querySelectorAll(".stab").forEach(x=>x.classList.toggle("on",x===b));
  applyWallFilter(b.dataset.f);
 });
 document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(location.href);b.style.borderColor="var(--accent)";b.style.color="var(--accent)";b.setAttribute("aria-label",t("copied"))}catch(e){}
 }));
 const th=$("#view .ph h1")||$("#view .article h1")||$("#view [data-title]");
 document.title=(th?th.textContent.trim()+" · ":"")+CONFIG.site.name+(th?"":" — "+(LANG==="ta"?"தமிழ் செய்திகள், நேரலை":"Tamil news, live TV"));
 updateProgress();
}

/* refresh the wall in place — never re-route, which would scroll the reader
   back to the top of the page mid-read */
function renderWall(){
 const box=$("#wallbox"); if(box)box.innerHTML=wallHTML();
}
function applyWallFilter(f){ WALL.f=f||"all"; WALL.n=24; renderWall(); }
function refreshWall(){
 if(!$("#wallbox"))return;
 renderWall();
 const fs=document.querySelector("#view .fstat");
 if(fs)fs.outerHTML=feedStatus();
}
/* one delegated handler for every "show more" button, whatever re-renders it */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-more]"); if(!b)return;
 const k=b.getAttribute("data-more");
 if(k==="wall"){ WALL.n+=24; renderWall(); }
 if(k==="vids"){ VIDPAGE.n+=24; const v=$("#vidbox"); if(v)v.innerHTML=vidsHTML(); }
});
let refreshTimer=null;
function scheduleRefresh(){
 clearInterval(refreshTimer);
 if(!CONFIG.feed||!CONFIG.feed.endpoint)return;
 const mins=Math.max(2,Number(CONFIG.feed.refreshMinutes)||10);
 refreshTimer=setInterval(()=>{
  if(document.visibilityState!=="visible")return;
  loadSocial().then(ok=>{ if(ok)refreshWall(); });
 },mins*60000);
}

/* ═══════════ WIRING ═══════════ */
function openDrawer(){$("#draw").classList.add("on");$("#scrim").classList.add("on");$("#hamb").setAttribute("aria-expanded","true")}
function closeDrawer(){$("#draw").classList.remove("on");$("#scrim").classList.remove("on");$("#hamb").setAttribute("aria-expanded","false")}
function applyTheme(m){
 if(m)document.documentElement.setAttribute("data-theme",m);else document.documentElement.removeAttribute("data-theme");
 const dark=m==="dark"||(!m&&window.matchMedia("(prefers-color-scheme:dark)").matches);
 $("#t-ico").innerHTML=dark
  ?'<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>'
  :'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
}
function updateProgress(){
 const a=$("#view .article"), bar=$("#prog");
 if(!a){bar.style.width="0";return}
 const r=a.getBoundingClientRect(), total=r.height-window.innerHeight;
 const done=total<=0?1:Math.min(1,Math.max(0,-r.top/total));
 bar.style.width=(done*100).toFixed(2)+"%";
}
function renderDebug(){
 if(!/[?&]debug=1/.test(location.search))return;
 const d=document.createElement("div");d.className="dbg";
 const ep=(CONFIG.feed&&CONFIG.feed.endpoint)||"(not set)";
 const rows=Object.keys(SRC).map(k=>{const v=SOCIAL.sources[k];
   return k+": "+(v?(v.ok?`<span class="ok">${v.count} posts</span>`:`<span class="no">${esc(v.error||"failed")}</span>`):`<span class="no">—</span>`)}).join("<br>");
 const dbline=SB.ready()
   ?(DB.ok?`<span class="ok">${DB.count} published</span>`:`<span class="no">${esc(DB.error||"—")}</span>`)
   :`<span class="no">not configured</span>`;
 d.innerHTML=`<b>Newsroom</b><br>articles: ${dbline}<br>`+
  `signed in: ${SB.token?`<span class="ok">${esc((SB.user&&SB.user.email)||"yes")} · ${esc(SB.role||"no role")}</span>`:`<span class="no">no</span>`}<br><br>`+
  `<b>Connector</b><br>${esc(ep)}<br>`+
  (SOCIAL.error?`<span class="no">${esc(SOCIAL.error)}</span><br>`:"")+rows+
  `<br><b>Direct fallback</b><br>YouTube: <span class="${FEED.yt.ok?"ok":"no"}">${esc(FEED.yt.why)}</span><br>`+
  `Facebook: <span class="${FEED.fb.ok?"ok":"no"}">${esc(FEED.fb.why)}</span><br>`+
  `Inline embeds: <span class="${CAN_EMBED?"ok":"no"}">${CAN_EMBED?"on":"off (sandbox)"}</span>`;
 document.body.appendChild(d);
}
function boot(){
 applyTheme(store.get("vt-theme"));
 SB.url=(CONFIG.supabase&&CONFIG.supabase.url)||"";
 SB.key=(CONFIG.supabase&&CONFIG.supabase.anonKey)||"";
 SB.load();
 paintChrome(); route();
 addEventListener("hashchange",route);
 let nt; addEventListener("resize",()=>{clearTimeout(nt);nt=setTimeout(fitNav,120)},{passive:true});
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitNav).catch(()=>{});
 setTimeout(fitNav,400);
 addEventListener("scroll",updateProgress,{passive:true});
 addEventListener("resize",updateProgress,{passive:true});
 $("#hamb").addEventListener("click",openDrawer);
 $("#d-x").addEventListener("click",closeDrawer);
 $("#scrim").addEventListener("click",closeDrawer);
 $("#draw").addEventListener("click",e=>{if(e.target.closest("a"))closeDrawer()});
 addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();$("#searchbar").hidden=true}});
 $("#o-search").addEventListener("click",()=>{
  const b=$("#searchbar"); b.hidden=!b.hidden; if(!b.hidden)$("#q").focus();
 });
 $("#c-search").addEventListener("click",()=>{$("#searchbar").hidden=true});
 $("#sform").addEventListener("submit",e=>{
  e.preventDefault(); const q=$("#q").value.trim();
  if(q){location.hash="#/search?q="+encodeURIComponent(q);$("#searchbar").hidden=true}
 });
 $("#t-theme").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const sys=window.matchMedia("(prefers-color-scheme:dark)").matches;
  const next=cur?(cur==="dark"?"light":"dark"):(sys?"light":"dark");
  store.set("vt-theme",next);applyTheme(next);
 });
 $("#t-lang").addEventListener("click",()=>{LANG=LANG==="ta"?"en":"ta";store.set("vt-lang",LANG);paintChrome();route()});
 (async()=>{
  /* newsroom first — published articles replace the built-in starter set */
  if(SB.ready()){
   await loadSiteSettings();
   const fromDb=await loadArticles();
   if(SB.token){ await SB.whoami(); if(SB.isStaff())await refreshAdmin(); }
   if(fromDb||SB.token){paintChrome();route()}
  }
  /* prefer the server connector: one request, no tokens in the page */
  const viaConnector=await loadSocial();
  if(!viaConnector){
   /* no connector configured — fall back to whatever direct keys exist */
   await Promise.allSettled([loadYouTube(),loadFacebook()]);
   socialFromDirect();
  }
  if(viaConnector||FEED.yt.ok||SOCIAL.ok){paintChrome();route()}
  const sc=$("#socialcards"); if(sc)sc.innerHTML=followCards();
  scheduleRefresh(); renderDebug();
 })();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script>
