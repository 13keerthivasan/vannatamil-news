/* ═══════════ TOKENS ═══════════ */

}

/* ═══════════ BASE ═══════════ */
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.24;text-wrap:balance}
p{margin:0}
hr{border:none;border-top:1px solid var(--rule);margin:0}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ═══════════ NEWSPAPER PRIMITIVES ═══════════ */
.dbl{height:5px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}
.hair{height:1px;background:var(--rule)}
.label{font:600 10.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.kicker{display:inline-block;font:600 11px/1 var(--f-body);letter-spacing:.17em;text-transform:uppercase;color:var(--kc,var(--accent));margin-bottom:9px}
.eyebrow{position:relative;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px;border-bottom:1px solid var(--ink);padding-bottom:9px;margin-bottom:24px}
.eyebrow::after{content:"";position:absolute;left:0;bottom:-1px;width:72px;height:3px;background:var(--kc,var(--accent))}
.eyebrow h2{font-size:clamp(19px,2.1vw,25px);font-weight:600;letter-spacing:-.005em;min-width:0;overflow-wrap:anywhere}
.eyebrow .more{margin-inline-start:auto;flex-shrink:0;font:600 10.5px/1 var(--f-body);letter-spacing:.17em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:color .15s;white-space:nowrap}
.eyebrow .more:hover{color:var(--kc,var(--accent))}
.dline{display:flex;align-items:center;gap:8px;font:400 12.5px/1.4 var(--f-body);color:var(--muted)}
.dline .dpl{font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.dline .dot{width:2px;height:2px;border-radius:50%;background:var(--faint);flex-shrink:0}
section{margin-block:52px}

/* column rules — the alignment device */
.cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols.c2,.cols.c3,.cols.c4{row-gap:32px}
.cols{display:grid;gap:0}
.cols>*{padding-inline:var(--gut);min-width:0}
.cols>*:first-child{padding-inline-start:0}
.cols>*:last-child{padding-inline-end:0}
.cols>*+*{border-inline-start:1px solid var(--rule)}

/* ═══════════ UTILITY BAR ═══════════ */
.util{border-bottom:1px solid var(--rule-2);background:var(--surface)}
.util .wrap{display:flex;align-items:center;gap:18px;min-height:36px}
.util .sp{margin-inline-start:auto}
.util a,.util button{font:500 12px/1 var(--f-body);color:var(--muted);letter-spacing:.02em;transition:color .15s}
.util a:hover,.util button:hover{color:var(--accent)}
.udate{font:500 12px/1 var(--f-body);color:var(--ink-2);letter-spacing:.03em;white-space:nowrap}
.usoc{display:inline-flex;gap:13px;align-items:center}
.usoc a{display:grid;place-items:center}
.usoc svg{width:14px;height:14px;fill:currentColor;display:block}
.tsep{width:1px;height:14px;background:var(--rule)}

/* ═══════════ NAMEPLATE ═══════════ */
.plate{background:var(--surface)}
.plate .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding-block:22px}
.plate-l{display:flex;flex-direction:column;gap:3px}
.plate-l .big{font-family:var(--f-display);font-size:15px;font-weight:600;color:var(--ink)}
.plate-l .sm{font:400 12px/1.4 var(--f-body);color:var(--muted)}
.plate-c img{height:66px;width:auto;display:block}
.plate-r{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.livebtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--live);color:var(--live);font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:9px 15px;transition:.16s}
.livebtn:hover{background:var(--live);color:#fff}
.livebtn:hover .dotp{background:#fff}
.dotp{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 currentColor;animation:pp 2s infinite}
@keyframes pp{0%{box-shadow:0 0 0 0 rgba(200,16,46,.55)}70%{box-shadow:0 0 0 7px rgba(200,16,46,0)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--rule);color:var(--ink-2);transition:.15s}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ═══════════ NAV ═══════════ */
.nav{background:var(--surface)}
.nav .wrap{display:flex;justify-content:center;justify-content:safe center;align-items:center;flex-wrap:nowrap;gap:0;overflow-x:auto;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.navl{position:relative;padding:13px calc(var(--navfs,16px) * .78);font-family:var(--f-display);font-size:var(--navfs,16px);font-weight:500;color:var(--ink);transition:color .15s;white-space:nowrap;flex:0 0 auto}
.navl:hover{color:var(--accent)}
.navl::after{content:"";position:absolute;left:7px;right:7px;bottom:6px;height:1.5px;background:var(--nc,var(--accent));transform:scaleX(0);transform-origin:left;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.navl:hover::after,.navl.on::after{transform:scaleX(1)}
.navl.on{color:var(--nc,var(--accent))}

/* ═══════════ LATEST STRIP ═══════════ */
.strip{border-block:1px solid var(--rule);background:var(--surface);overflow:hidden}
.strip .wrap{display:flex;align-items:stretch;padding-inline:24px;min-width:0}
.strip-l{display:flex;align-items:center;gap:8px;padding-inline-end:20px;border-inline-end:1px solid var(--rule);flex-shrink:0}
.strip-l span{font:600 10.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--live)}
.strip-v{flex:1;min-width:0;overflow:hidden;position:relative;display:block;-webkit-mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 52px),transparent);mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 52px),transparent)}
.strip-t{display:flex;width:max-content;animation:roll 58s linear infinite}
.strip:hover .strip-t{animation-play-state:paused}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.strip-i{display:inline-flex;align-items:center;gap:11px;padding:11px 22px;font-size:14.5px;color:var(--ink-2);white-space:nowrap;transition:color .15s}
.strip-i:hover{color:var(--accent)}
.strip-i b{font:600 10px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--kc)}
@media (prefers-reduced-motion:reduce){.strip-t{animation:none}.strip-v{overflow-x:auto;-webkit-mask-image:none;mask-image:none}}

/* ═══════════ MEDIA ═══════════ */
.fig{position:relative;overflow:hidden;background:var(--sunken);aspect-ratio:16/9}
.fig img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.3,1),filter .3s}
a:hover .fig img{transform:scale(1.035)}
.fig.sq{aspect-ratio:1/1}
.fig.tall{aspect-ratio:4/3}
.fig.ph{display:grid;place-items:center}
.fig.ph::after{content:"VANNATAMIL";font:600 11px/1 var(--f-body);letter-spacing:.24em;color:var(--faint)}
.pl{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.pl i{width:52px;height:52px;border-radius:50%;background:rgba(14,8,18,.55);backdrop-filter:blur(4px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.28);transition:background .25s,transform .25s}
.pl i::after{content:"";width:0;height:0;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
a:hover .pl i{background:var(--live);border-color:var(--live);transform:scale(1.06)}
.pl.sm i{width:38px;height:38px}
.pl.sm i::after{border-left-width:10px;border-top-width:6.5px;border-bottom-width:6.5px;margin-left:3px}
.cap{font:400 12px/1.55 var(--f-body);color:var(--muted);padding-top:9px;border-top:1px solid var(--rule-2);margin-top:11px}

/* ═══════════ LEAD BLOCK ═══════════ */
.top{grid-template-columns:minmax(0,1.62fr) minmax(0,.94fr) minmax(0,.78fr)}
.lead h1{font-size:clamp(30px,3.9vw,50px);font-weight:700;line-height:1.1;letter-spacing:-.022em;margin-block:4px 14px}
.lead:hover h1{color:var(--accent)}
.lead .dek{font-size:17.5px;line-height:1.66;color:var(--ink-2);margin-bottom:14px;max-width:60ch}
.lead .fig{margin-bottom:18px}

.feed{display:flex;flex-direction:column}
.feed>a{padding-block:20px;border-bottom:1px solid var(--rule-2)}
.feed>a:first-child{padding-top:0}
.feed>a:last-child{border-bottom:none;padding-bottom:0}
.fi{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:16px;align-items:start}
.fi.nomed{grid-template-columns:minmax(0,1fr)}
.fi h3{font-size:18.5px;font-weight:600;line-height:1.34;margin-bottom:8px}
.feed>a:hover h3{color:var(--accent)}

.index{display:flex;flex-direction:column}
.index>a{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding-block:15px;border-bottom:1px solid var(--rule-2);align-items:start}
.index>a:first-child{padding-top:0}
.index>a:last-child{border-bottom:none}
.index .n{font-family:var(--f-display);font-size:26px;font-weight:400;line-height:1;color:var(--rule);letter-spacing:-.04em}
.index>a:hover .n{color:var(--kc,var(--accent))}
.index h4{font-size:15.5px;font-weight:500;line-height:1.42}
.index>a:hover h4{color:var(--accent)}

/* ═══════════ LIVE PANEL ═══════════ */
.lvpanel{background:var(--band);color:var(--band-ink);padding:22px}
.lvpanel .lvtop{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.lvpanel .lvtop span{font:600 10.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:#fff;background:var(--live);padding:4px 9px}
.lvpanel h3{font-size:20px;color:#fff;margin-bottom:8px}
.lvpanel p{font-size:14px;color:var(--band-muted);line-height:1.62;margin-bottom:16px}
.lvpanel .ln{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--band-rule);padding-top:13px;font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:#fff;transition:gap .2s}
.lvpanel .ln:hover{color:var(--live)}

/* ═══════════ BUTTONS ═══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--ink);color:var(--ink);transition:.16s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn-a{border-color:var(--accent);color:var(--accent)}
.btn-a:hover{background:var(--accent);color:#fff}
.btn-f{border-color:rgba(255,255,255,.35);color:#fff}
.btn-f:hover{background:#fff;color:var(--band)}
.btn svg{width:15px;height:15px;fill:currentColor;flex-shrink:0}
.btn-w{width:100%}

/* ═══════════ AD SLOT ═══════════ */
.ad{display:grid;place-items:center;text-align:center;border:1px solid var(--rule);padding:22px;background:var(--surface)}
.ad .l{font:600 10px/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.ad .s{font-family:var(--f-display);font-size:15px;color:var(--ink-2);margin-top:8px}
.ad .c{font:500 12px/1 var(--f-body);margin-top:11px;color:var(--accent);letter-spacing:.03em;border-bottom:1px solid currentColor;padding-bottom:2px;display:inline-block}
.ad.lb{min-height:104px}
.ad.sb{min-height:256px}

/* ═══════════ CARDS ═══════════ */
.g{display:grid;gap:var(--gut) var(--gut)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{display:flex;flex-direction:column}
.card .fig{margin-bottom:13px}
.card h3{font-size:17.5px;font-weight:600;line-height:1.36;margin-bottom:8px}
.card:hover h3{color:var(--accent)}
.card .dek{font-size:14.5px;color:var(--muted);line-height:1.6;margin-bottom:9px}
.card.wide h3{font-size:20px}
.card.txt{border-top:2px solid var(--ink);padding-top:15px}
.card.txt h3{font-size:19px}

/* section list variant */
.slist>a{display:grid;grid-template-columns:76px minmax(0,1fr);gap:15px;padding-block:16px;border-bottom:1px solid var(--rule-2);align-items:start}
.slist>a:first-child{padding-top:0}
.slist>a:last-child{border-bottom:none;padding-bottom:0}
.slist h3{font-size:16.5px;font-weight:600;line-height:1.36;margin-bottom:6px}
.slist>a:hover h3{color:var(--accent)}

/* ═══════════ GALLERY ═══════════ */
.gal{display:grid;max-width:100%;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);gap:var(--gut);overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.gal::-webkit-scrollbar{height:5px}
.gal::-webkit-scrollbar-thumb{background:var(--rule)}
.gal>a{scroll-snap-align:start}
.gal .fig{aspect-ratio:3/2;margin-bottom:10px}
.gal h4{font-size:14.5px;font-weight:500;line-height:1.42;font-family:var(--f-body)}
.gal>a:hover h4{color:var(--accent)}

/* ═══════════ PAGE HEAD ═══════════ */
.ph{border-bottom:1px solid var(--ink);background:var(--surface);padding-block:40px 26px;position:relative}
.ph::after{content:"";position:absolute;left:24px;bottom:-1px;width:96px;height:3px;background:var(--kc,var(--accent))}
.ph .wrap{max-width:var(--wrap)}
.ph h1{font-size:clamp(30px,4.4vw,48px);font-weight:700;letter-spacing:-.025em}
.ph .sub{color:var(--muted);font-size:16.5px;margin-top:11px;max-width:62ch;line-height:1.62}
.crumb{display:flex;align-items:center;gap:9px;font:500 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.crumb a:hover{color:var(--accent)}
.crumb svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.4}

/* ═══════════ ARTICLE ═══════════ */
.prog{position:fixed;top:0;left:0;height:2.5px;background:var(--accent);width:0;z-index:95;transition:width .08s linear}
.art{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:56px;align-items:start;margin-block:40px 0}
.article h1{font-size:clamp(30px,4.2vw,47px);font-weight:700;letter-spacing:-.026em;line-height:1.1;margin-block:6px 16px}
.article .dek{font-size:20px;line-height:1.58;color:var(--ink-2);margin-bottom:22px;max-width:60ch;font-weight:300}
.byl{display:flex;align-items:center;gap:13px;padding-block:15px;border-block:1px solid var(--rule);margin-bottom:26px;flex-wrap:wrap}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;flex-shrink:0}
:root[data-theme="dark"] .av,:root:not([data-theme="light"]) .av{color:#16121D}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .av{color:#fff}}
.byn{font:600 14px/1.3 var(--f-body)}
.bym{font:400 12px/1.4 var(--f-body);color:var(--muted)}
.shr{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.shr .label{margin-inline-end:3px}
.shr a,.shr button{width:32px;height:32px;border:1px solid var(--rule);display:grid;place-items:center;color:var(--muted);transition:.15s}
.shr a:hover,.shr button:hover{border-color:var(--accent);color:var(--accent)}
.shr svg{width:14px;height:14px;fill:currentColor}
.shr button svg{fill:none;stroke:currentColor;stroke-width:1.8}
.prose{font-size:18px;line-height:1.82;color:var(--ink-2);max-width:66ch}
.prose>p{margin-bottom:22px}
.prose>p:first-of-type{font-size:19.5px;line-height:1.74;color:var(--ink)}
:root[lang="en"] .prose>p:first-of-type::first-letter{font-family:var(--f-display);float:left;font-size:58px;line-height:.88;font-weight:600;color:var(--ink);padding-inline-end:11px;padding-top:6px}
.prose strong{color:var(--ink);font-weight:600}
.prose h2{font-size:25px;margin-block:36px 14px;color:var(--ink)}
.prose ul{margin-block:0 22px;padding-inline-start:0;list-style:none}
.prose li{margin-bottom:11px;padding-inline-start:20px;position:relative}
.prose li::before{content:"";position:absolute;inset-inline-start:0;top:.72em;width:7px;height:1.5px;background:var(--accent)}
.pq{margin-block:34px;padding-block:22px;border-block:1px solid var(--ink);font-family:var(--f-display);font-size:23px;font-weight:500;line-height:1.46;color:var(--ink);text-align:center;max-width:52ch;margin-inline:auto}
.tagr{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:34px;padding-top:20px;border-top:1px solid var(--rule)}
.tag{font:500 12.5px/1 var(--f-body);padding:7px 13px;border:1px solid var(--rule);color:var(--ink-2);transition:.15s}
.tag:hover{border-color:var(--accent);color:var(--accent)}

/* ═══════════ RAIL ═══════════ */
.rail{display:flex;flex-direction:column;gap:34px;position:sticky;top:20px}
.rblk .eyebrow{margin-bottom:16px}

/* ═══════════ BAND ═══════════ */
.band{background:var(--band);color:var(--band-ink);padding-block:56px;margin-block:64px}
.band h2{color:#fff;font-size:clamp(25px,3.2vw,36px);font-weight:600;letter-spacing:-.018em;margin-bottom:12px}
.band p{color:var(--band-muted);font-size:16.5px;line-height:1.66;max-width:52ch;margin-bottom:24px}
.band .eyebrow{border-bottom-color:var(--band-rule)}
.band .eyebrow h2{font-size:22px}

/* ═══════════ THEATRE ═══════════ */
.thr{background:#0A070E;border:1px solid var(--band-rule)}
.scr{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;padding:26px;background:radial-gradient(110% 120% at 50% 0%,#241733 0%,#0A070E 74%)}
.scr .in{max-width:400px}
.scr h3{color:#fff;font-size:clamp(19px,2.4vw,25px);margin-block:16px 9px}
.scr p{color:#A192AE;font-size:14.5px;margin-bottom:20px}
.bigpl{width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(200,16,46,.92);display:grid;place-items:center;margin-inline:auto;transition:transform .25s}
.bigpl:hover{transform:scale(1.07)}
.bigpl::after{content:"";width:0;height:0;border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.thrbar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--band-rule);flex-wrap:wrap}
.thrbar .t{color:#F0E9F4;font-size:14.5px;font-weight:500}
.thrbar .s{color:#8E7F9B;font-size:12.5px;margin-inline-start:auto}
.lvgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.chat{border:1px solid var(--rule);display:flex;flex-direction:column;height:456px;background:var(--surface)}
.chat-h{padding:13px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:9px}
.chat-b{flex:1;display:grid;place-items:center;text-align:center;padding:26px;color:var(--muted)}
.chat-b p{font-size:14px;max-width:30ch;line-height:1.62;margin-top:14px}

/* ═══════════ EMPTY ═══════════ */
.empty{text-align:center;padding:64px 26px;border:1px solid var(--rule);background:var(--surface)}
.empty h3{font-size:23px;margin-bottom:10px}
.empty p{color:var(--muted);font-size:15.5px;max-width:46ch;margin:0 auto 22px;line-height:1.66}
.empty .ln{width:48px;height:2px;background:var(--accent);margin:0 auto 20px}

/* ═══════════ FOOTER ═══════════ */
.foot{background:var(--band);color:var(--band-muted);margin-top:0}
.foot .top{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.3fr;gap:44px;padding-block:52px 34px}
.foot img.lg{height:58px;width:auto;margin-bottom:16px}
.foot h4{color:#fff;font:600 10.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--band-rule)}
.foot .ab{font-size:14.5px;line-height:1.72;max-width:40ch;margin-bottom:20px}
.fl{display:flex;flex-direction:column;gap:11px;font-size:14.5px}
.fl a{transition:color .15s}
.fl a:hover{color:#fff}
.fc{display:flex;flex-direction:column;gap:13px;font-size:14.5px}
.fc div{display:flex;gap:11px;align-items:flex-start}
.fc svg{width:15px;height:15px;stroke:var(--band-muted);fill:none;stroke-width:1.8;flex-shrink:0;margin-top:4px}
.foot .usoc{color:var(--band-muted);gap:16px}
.foot .usoc a:hover{color:#fff}
.fbar{border-top:1px solid var(--band-rule);padding-block:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.fbar .sp{margin-inline-start:auto}
.fbar a:hover{color:#fff}

/* ═══════════ FLOAT + DRAWER ═══════════ */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab a{display:inline-flex;align-items:center;gap:9px;padding:12px 17px;font:600 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#fff;box-shadow:0 8px 26px -10px rgba(0,0,0,.6);transition:transform .18s}
.fab a:hover{transform:translateY(-2px)}
.fab .wa{background:#12A150}.fab .tg{background:#2496D0}
.fab svg{width:16px;height:16px;fill:currentColor;flex-shrink:0}
.scrim{position:fixed;inset:0;background:rgba(10,6,14,.62);z-index:70;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.draw{position:fixed;inset-block:0;inset-inline-end:0;width:min(86vw,338px);background:var(--surface);z-index:80;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s linear .28s;overflow-y:auto;visibility:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px))}
.draw.on{transform:translateX(0);visibility:visible;transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s}
.draw .dh{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--ink);margin-bottom:6px}
.draw .dh strong{font-family:var(--f-display);font-size:17px}
.dl{display:block;padding:13px 0;border-bottom:1px solid var(--rule-2);font-family:var(--f-display);font-size:17px;font-weight:500;transition:color .15s;position:relative;padding-inline-start:14px}
.dl::before{content:"";position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--kc,var(--accent));opacity:0;transition:opacity .15s}
.dl:hover{color:var(--accent)}.dl:hover::before{opacity:1}
.dsec{font:600 10px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-block:22px 6px}

 place:P("திருவாரூர்","Thiruvarur"),
 h:P("திருவாரூர் மாவட்டத்தில் ரேஷன் கடைகளுக்குப் பொருட்கள் வரவில்லை; கடை ஊழியரின் ஒப்புதல் வாக்குமூலம்","Ration shops across Thiruvarur still waiting on supplies; shop worker confirms the shortfall"),
 d:P("மாதத் தொடக்கத்தில் வழங்கப்பட வேண்டிய அரிசி, பருப்பு உள்ளிட்ட பொருட்கள் இன்னும் வந்து சேராததால், நியாய விலைக் கடைகளுக்கு வரும் குடும்ப அட்டைதாரர்கள் வெறுங்கையுடன் திரும்புகின்றனர்.","Card holders are being turned away as rice, pulses and other staples due at the start of the month have still not reached fair-price shops."),
 quote:P("கிடங்கிலிருந்து வந்தால்தான் கொடுக்க முடியும் — தொடர்ந்து தகவல் சொல்லியும் வாகனம் இன்னும் வரவில்லை.","We can only hand out what the warehouse sends. We keep reporting it, and the vehicle still has not come."),
 body:[
  P("திருவாரூர் மாவட்டத்தின் பல பகுதிகளில் உள்ள நியாய விலைக் கடைகளுக்கு இந்த மாதத்திற்கான பொருட்கள் இன்னும் வந்து சேரவில்லை என்று குடும்ப அட்டைதாரர்கள் தெரிவிக்கின்றனர்.","Card holders in several parts of Thiruvarur district say this month's stock has still not arrived at their fair-price shops."),
  P("காலையில் கடை திறந்ததும் வரிசையில் நின்றவர்கள், அரிசியும் பருப்பும் இல்லை என்று அறிந்து திரும்பிச் சென்றதாகப் பகுதி மக்கள் கூறுகின்றனர். தினக்கூலி வேலைக்குச் செல்பவர்கள் ஒரு நாள் வருமானத்தை இழந்து மீண்டும் வர வேண்டிய நிலை ஏற்பட்டுள்ளது.","Residents say people who queued when the shutters went up in the morning learned there was no rice or dal and went home. Those on daily wages have lost a day's earnings and must come back again."),
  P("ரேஷன் கடை ஊழியர் ஒருவர் வண்ணதமிழ் நியூஸிடம் பேசுகையில், கிடங்கிலிருந்து பொருட்கள் வந்தால் மட்டுமே விநியோகம் செய்ய முடியும் என்றும், தாங்கள் தொடர்ந்து தகவல் தெரிவித்தும் வாகனம் இன்னும் வரவில்லை என்றும் ஒப்புக்கொண்டார்.","A shop worker, speaking to Vannatamil News, accepted that distribution can only begin once the warehouse delivers, and said that despite repeated reports the vehicle had not arrived."),
  P("முதியவர்களும் மாற்றுத்திறனாளிகளும் நீண்ட தூரம் பயணித்து வர வேண்டியிருப்பதால், விநியோகம் தாமதமாகும் நாட்களில் முன்கூட்டியே தகவல் தெரிவிக்க வேண்டும் என்று பகுதி மக்கள் கோரிக்கை வைத்துள்ளனர்.","Because elderly and disabled card holders travel a long way to reach the shop, residents have asked that a notice be put out in advance on days when distribution is delayed.")],
 tags:P(["ரேஷன்","திருவாரூர்","மக்கள் நலம்"],["Ration","Thiruvarur","Welfare"])},

{id:"sewage",cat:"district",img:"qCHKX7YJ8bs",vid:"qCHKX7YJ8bs",mins:96,read:2,
 place:P("சீர்காழி","Sirkazhi"),
 h:P("சீர்காழி பிடாரி வடக்கு வீதியில் குடிநீர்க் குழாயைச் சுற்றி கழிவுநீர்","Sewage pooling around the drinking-water tap on Sirkazhi's Pidari North Street"),
 d:P("பொதுக் குழாயில் தண்ணீர் பிடிக்க வரும் மக்கள் தேங்கிய கழிவுநீரைக் கடந்தே செல்ல வேண்டியுள்ளது; நோய்த்தொற்று அச்சத்தில் குடியிருப்புவாசிகள்.","Residents filling pots at the public tap have to wade past standing sewage, and fear an outbreak."),
 body:[
  P("சீர்காழி பிடாரி வடக்கு வீதியில் உள்ள பொதுக் குடிநீர்க் குழாயைச் சுற்றி கழிவுநீர் தேங்கி நிற்பதாக அப்பகுதி மக்கள் புகார் தெரிவித்துள்ளனர்.","Residents of Pidari North Street in Sirkazhi have complained that waste water is collecting around the public drinking-water tap."),
  P("குழாயை அடைய கழிவுநீரைக் கடந்து செல்ல வேண்டியிருப்பதாகவும், குழந்தைகளும் முதியவர்களும் தினமும் அதே வழியில் தண்ணீர் எடுக்கச் செல்வதாகவும் அவர்கள் கூறுகின்றனர்.","They say anyone reaching the tap must cross the pooled water, and that children and elderly residents make the same trip every day."),
  P("கொசுத் தொல்லையும் துர்நாற்றமும் அதிகரித்துள்ள நிலையில், வடிகால் பணிகளை விரைந்து முடிக்க வேண்டும் என்று குடியிருப்புவாசிகள் கோரிக்கை வைத்துள்ளனர்.","With mosquitoes and the smell both worsening, residents have asked for the drainage work to be completed quickly.")],
 tags:P(["சீர்காழி","குடிநீர்","சுகாதாரம்"],["Sirkazhi","Water","Sanitation"])},

{id:"crocodile",cat:"district",img:"IJqfeRKAFuQ",vid:"IJqfeRKAFuQ",mins:184,read:2,
 place:P("சீர்காழி","Sirkazhi"),
 h:P("சீர்காழி அருகே குளத்தில் புகுந்த முதலை; தண்ணீரை நெருங்க அஞ்சும் கிராம மக்கள்","Crocodile in a village pond near Sirkazhi keeps residents away from the water"),
 d:P("வழக்கமாகக் கால்நடைகளுக்குத் தண்ணீர் காட்டப்படும் குளத்தில் முதலை காணப்பட்டதால், பகுதி மக்கள் எச்சரிக்கையாக உள்ளனர்.","A crocodile has been seen in a pond normally used to water livestock, and villagers are staying clear."),
 body:[
  P("சீர்காழி அருகே உள்ள கிராமம் ஒன்றின் குளத்தில் முதலை ஒன்று புகுந்திருப்பதாகக் கிராம மக்கள் தெரிவித்துள்ளனர்.","Villagers near Sirkazhi say a crocodile has entered a pond in their village."),
  P("குளத்தில் துணி துவைப்பதும் கால்நடைகளுக்குத் தண்ணீர் காட்டுவதும் வழக்கமாக இருந்த நிலையில், தற்போது அந்தப் பக்கம் செல்ல மக்கள் அஞ்சுகின்றனர்.","The pond is normally used for washing clothes and watering cattle, but people are now avoiding it."),
  P("முதலையைப் பாதுகாப்பாகப் பிடித்து உரிய இடத்தில் விட வேண்டும் என்றும், அதுவரை குளத்தின் அருகே எச்சரிக்கைப் பலகை வைக்க வேண்டும் என்றும் கிராம மக்கள் கோரியுள்ளனர்.","Residents have asked that the animal be caught safely and relocated, and that a warning board be put up beside the pond until then.")],
 tags:P(["சீர்காழி","வனவிலங்கு","கிராமம்"],["Sirkazhi","Wildlife","Village"])},

{id:"accident",cat:"district",img:"bZ2W5EQ2Y7k",vid:"bZ2W5EQ2Y7k",mins:268,read:2,
 place:P("நாகப்பட்டினம்","Nagapattinam"),
 h:P("நாகை அருகே இருள் சூழ்ந்த சாலையில் விபத்து: அரசு மருத்துவக் கல்லூரி செவிலியர் படுகாயம்","Nurse seriously injured in crash on an unlit stretch of road near Nagapattinam"),
 d:P("தெரு விளக்குகள் இல்லாத பகுதியில் இரவு நேரத்தில் நிகழ்ந்த விபத்தில் செவிலியர் ஒருவர் படுகாயமடைந்தார்; விளக்குகளை சரிசெய்யக் கோரிக்கை.","A nurse was badly hurt in a night-time crash on a stretch with no working street lights. Residents want them repaired."),
 body:[
  P("நாகப்பட்டினம் அருகே தெரு விளக்குகள் எரியாத சாலைப் பகுதியில் இரவு நேரத்தில் ஏற்பட்ட விபத்தில் அரசு மருத்துவக் கல்லூரியைச் சேர்ந்த செவிலியர் ஒருவர் படுகாயமடைந்தார்.","A nurse attached to the government medical college was seriously injured in a night-time accident on a stretch of road near Nagapattinam where the street lights are not working."),
  P("பணி முடிந்து திரும்பிக் கொண்டிருந்தபோது விபத்து நிகழ்ந்ததாகவும், உடனடியாக மருத்துவமனைக்குக் கொண்டு செல்லப்பட்டதாகவும் தெரிவிக்கப்படுகிறது.","She was returning after her shift when the crash happened and was taken to hospital immediately."),
  P("இப்பகுதியில் இரவு நேரப் பணிக்குச் செல்பவர்கள் அதிகம் என்பதால், தெரு விளக்குகளை உடனடியாகச் சரிசெய்ய வேண்டும் என்று பொதுமக்கள் வலியுறுத்தியுள்ளனர்.","Because many people in the area travel for night shifts, residents have pressed for the lights to be repaired at once.")],
 tags:P(["நாகப்பட்டினம்","சாலைப் பாதுகாப்பு"],["Nagapattinam","Road safety"])},

{id:"cooptex",cat:"business",img:"IHA1aSxkaDs",vid:"IHA1aSxkaDs",mins:340,read:2,
 place:P("திருவாரூர்","Thiruvarur"),
 h:P("திருவாரூர் கோ-ஆப்டெக்ஸ் நிலையத்தில் தீபாவளி சிறப்புத் தள்ளுபடி விற்பனை","Diwali discount sale opens at the Thiruvarur Co-optex showroom"),
 d:P("பண்டிகைக் காலத்தை முன்னிட்டு கைத்தறி ஆடைகளுக்குச் சிறப்புத் தள்ளுபடி; நெசவாளர் சங்கங்களுக்கு ஆதரவு கிடைக்கும் என எதிர்பார்ப்பு.","Handloom goods are on special discount for the festival season, with weavers' societies expected to benefit."),
 body:[
  P("தீபாவளியை முன்னிட்டு திருவாரூர் கோ-ஆப்டெக்ஸ் விற்பனை நிலையத்தில் கைத்தறி ஆடைகளுக்குச் சிறப்புத் தள்ளுபடி விற்பனை தொடங்கியுள்ளது.","A special discount sale on handloom goods has begun at the Thiruvarur Co-optex showroom ahead of Diwali."),
  P("பருத்தி மற்றும் பட்டு ஆடைகள், வீட்டு உபயோகப் பொருட்கள் உள்ளிட்டவை தள்ளுபடியில் கிடைப்பதாக விற்பனை நிலையத் தரப்பில் தெரிவிக்கப்பட்டது.","Cotton and silk garments along with household textiles are among the items offered at a discount, the showroom said."),
  P("பண்டிகைக் கால விற்பனை நெசவாளர் சங்கங்களுக்கு கூடுதல் வருவாயை ஈட்டித் தரும் என்று எதிர்பார்க்கப்படுகிறது.","The festival trade is expected to bring additional income to weavers' societies.")],
 tags:P(["கோ-ஆப்டெக்ஸ்","கைத்தறி","தீபாவளி"],["Co-optex","Handloom","Diwali"])},

{id:"scamcalls",cat:"technology",mins:420,read:4,sample:true,
 place:P("செய்திப் பிரிவு","Newsdesk"),
 h:P("ஆன்லைன் மோசடி அழைப்புகளில் இருந்து தப்பிப்பது எப்படி? கவனிக்க வேண்டிய ஏழு விஷயங்கள்","Seven things to check before you trust a call asking for money"),
 d:P("வங்கி, காவல்துறை அல்லது கூரியர் நிறுவனம் என்ற பெயரில் வரும் அழைப்புகளில் என்ன கேட்கப்பட்டால் சந்தேகப்பட வேண்டும் என்பதற்கான எளிய வழிகாட்டி.","A plain guide to the warning signs in calls claiming to be from a bank, the police or a courier company."),
 body:[
  P("வங்கி ஊழியர், காவல்துறை அதிகாரி அல்லது கூரியர் நிறுவனப் பணியாளர் என்று அறிமுகப்படுத்திக் கொண்டு வரும் அழைப்புகள் பெருகியுள்ளன. சில எளிய விஷயங்களைக் கவனித்தாலே பெரும்பாலான மோசடிகளைத் தவிர்க்க முடியும்.","Calls from people introducing themselves as bank staff, police officers or courier agents have become common. A few simple checks are enough to avoid most of them."),
  P("**OTP எண்ணை யாரிடமும் சொல்ல வேண்டாம்.** வங்கியோ, காவல்துறையோ, எந்த அரசு அலுவலகமோ OTP எண்ணைக் கேட்பதில்லை. அதைக் கேட்கும் எவரும் மோசடி செய்பவரே.","**Never read out an OTP.** No bank, police station or government office asks for one. Anyone who does is running a scam."),
  P("**அவசரப்படுத்தினால் சந்தேகப்படுங்கள்.** ‘இப்போதே செய்யாவிட்டால் கணக்கு முடக்கப்படும்’ என்பது மோசடியாளர்களின் வழக்கமான உத்தி. உண்மையான அலுவலகம் யோசிக்க நேரம் தரும்.","**Urgency is the tell.** “Your account will be blocked unless you act now” is the standard pressure line. A real office gives you time to think."),
  P("**எண்ணை நீங்களே தேடிப் பாருங்கள்.** அழைத்தவர் தரும் எண்ணுக்குத் திரும்ப அழைக்காமல், வங்கி அட்டையின் பின்பக்கம் அல்லது அலுவல்பூர்வ இணையதளத்தில் உள்ள எண்ணைப் பயன்படுத்துங்கள்.","**Look the number up yourself.** Don't call back on a number the caller gave you — use the one printed on your card or on the official website."),
  P("**திரையைப் பகிரச் சொன்னால் உடனே துண்டியுங்கள்.** AnyDesk, TeamViewer போன்ற செயலிகளை நிறுவச் சொல்வது மோசடியின் தெளிவான அறிகுறி.","**Hang up if they ask to see your screen.** Being asked to install AnyDesk, TeamViewer or similar is a clear sign."),
  P("**சந்தேகம் வந்தால் 1930-ஐ அழைக்கவும்.** தேசிய சைபர் குற்ற உதவி எண் 1930 மூலம் பணப் பரிமாற்றத்தை விரைவாகப் புகாரளிக்க முடியும்; cybercrime.gov.in தளத்திலும் புகார் அளிக்கலாம்.","**Call 1930 if in doubt.** India's cybercrime helpline, 1930, can act quickly on a transfer that has just happened; complaints can also be filed at cybercrime.gov.in.")],
 tags:P(["சைபர் பாதுகாப்பு","மோசடி","வழிகாட்டி"],["Cyber safety","Fraud","Guide"])},

{id:"rationguide",cat:"tamil-nadu",mins:520,read:3,sample:true,
 place:P("செய்திப் பிரிவு","Newsdesk"),
 h:P("நியாய விலைக் கடை புகார்களை எங்கே பதிவு செய்வது? அட்டைதாரர்களுக்கான வழிகாட்டி","Where to file a fair-price shop complaint: a guide for card holders"),
 d:P("பொருட்கள் வரவில்லை, எடை குறைவாக உள்ளது, கடை திறக்கப்படவில்லை — இதுபோன்ற புகார்களை யாரிடம், எப்படிப் பதிவு செய்வது என்பதற்கான வழிமுறை.","Stock missing, short weight, shutters down — how and where to raise each of these complaints."),
 body:[
  P("நியாய விலைக் கடை தொடர்பான புகார்களுக்கு உரிய வழிமுறைகள் உள்ளன. புகார் எழுத்துப்பூர்வமாகப் பதிவு செய்யப்பட்டால் மட்டுமே அது பின்தொடரப்படும்.","There is a defined route for fair-price shop complaints, and only a complaint on record gets followed up."),
  P("**முதல் படி — கடையிலேயே பதிவு.** ஒவ்வொரு கடையிலும் புகார் பதிவேடு இருக்க வேண்டும். தேதியுடன் புகாரைப் பதிவு செய்து, பதிவு எண்ணைக் குறித்து வைத்துக் கொள்ளுங்கள்.","**Start at the shop.** Every shop is required to keep a complaint register. Enter the complaint with the date and note down the entry number."),
  P("**இரண்டாம் படி — உணவுப் பொருள் வழங்கல் அலுவலர்.** வட்டார அளவில் உள்ள அலுவலரிடம் நேரிலோ எழுத்துப்பூர்வமாகவோ புகார் அளிக்கலாம்.","**Then the supply officer.** A complaint can be given to the taluk-level civil supplies officer in person or in writing."),
  P("**மூன்றாம் படி — தொலைபேசி மற்றும் இணையம்.** தமிழ்நாடு உணவுப் பொருள் வழங்கல் துறையின் கட்டணமில்லா எண் 1967 மூலமும், consumer.tn.gov.in தளத்தின் மூலமும் புகார் பதிவு செய்யலாம்.","**Phone and online.** Complaints can also be logged on the state civil supplies toll-free number 1967 and at consumer.tn.gov.in."),
  P("புகார் அளிக்கும்போது குடும்ப அட்டை எண், கடை எண், தேதி ஆகியவற்றைக் குறிப்பிடுவது நடவடிக்கையை விரைவுபடுத்தும்.","Quoting the ration card number, the shop number and the date makes action faster.")],
 tags:P(["ரேஷன்","வழிகாட்டி","குடிமை உரிமை"],["Ration","Guide","Citizen rights"])},

{id:"udyam",cat:"business",mins:640,read:3,sample:true,
 place:P("செய்திப் பிரிவு","Newsdesk"),
 h:P("உத்யம் MSME பதிவு: சிறு தொழில் முனைவோர் தெரிந்துகொள்ள வேண்டியவை","Udyam MSME registration: what small business owners should know"),
 d:P("பதிவுக்குத் தேவையான ஆவணங்கள், கட்டணம் இல்லாத அதிகாரப்பூர்வ தளம், மற்றும் பதிவால் கிடைக்கும் சலுகைகள்.","The documents needed, the official free portal, and what registration actually gets you."),
 body:[
  P("உத்யம் பதிவு என்பது சிறு, குறு மற்றும் நடுத்தர நிறுவனங்களுக்கான அரசு அங்கீகாரம். இது முற்றிலும் இலவசம்; udyamregistration.gov.in என்ற அதிகாரப்பூர்வ தளத்தில் மட்டுமே பதிவு செய்ய வேண்டும்.","Udyam registration is the government's recognition for micro, small and medium enterprises. It is free, and should only be done on the official portal, udyamregistration.gov.in."),
  P("ஆதார் எண் மற்றும் பான் எண் இருந்தாலே பதிவைத் தொடங்கலாம். நிறுவனத்தின் வகை, முதலீடு மற்றும் வருடாந்திர விற்றுமுதல் விவரங்கள் கேட்கப்படும்.","An Aadhaar number and a PAN are enough to begin. You will be asked for the type of enterprise, the investment and the annual turnover."),
  P("பதிவு செய்த நிறுவனங்களுக்கு வங்கிக் கடன்களில் முன்னுரிமை, அரசு ஒப்பந்தங்களில் பங்கேற்பு, மற்றும் சில கட்டணச் சலுகைகள் கிடைக்கும்.","Registered enterprises get priority in bank lending, access to government tenders and certain fee concessions."),
  P("இடைத்தரகர்களுக்குக் கட்டணம் செலுத்த வேண்டிய அவசியமில்லை என்பதை நினைவில் கொள்ளுங்கள்.","Remember that there is no need to pay an agent for this.")],
 tags:P(["MSME","சிறு தொழில்","வழிகாட்டி"],["MSME","Small business","Guide"])},

{id:"upi",cat:"technology",mins:760,read:3,sample:true,
 place:P("செய்திப் பிரிவு","Newsdesk"),
 h:P("UPI பணப் பரிமாற்றத்தில் பாதுகாப்பை அதிகரிக்கும் அமைப்புகள்","Settings that make your UPI payments safer"),
 d:P("பரிவர்த்தனை வரம்பு, UPI ID பாதுகாப்பு, மற்றும் தவறுதலாகப் பணம் அனுப்பியதும் செய்ய வேண்டியவை.","Transaction limits, protecting your UPI ID, and what to do the moment money goes to the wrong account."),
 body:[
  P("UPI பயன்பாடு பெருகியுள்ள நிலையில், சில அமைப்புகளை மாற்றுவதன் மூலம் பாதுகாப்பை எளிதாக அதிகரிக்க முடியும்.","With UPI in daily use, a few settings changes go a long way."),
  P("**தினசரி வரம்பை நிர்ணயியுங்கள்.** பெரும்பாலான செயலிகளில் தினசரி அனுப்பும் தொகைக்கு வரம்பு வைக்க முடியும். உங்கள் வழக்கமான தேவைக்கேற்ப அதைக் குறைத்து வைப்பது நல்லது.","**Set a daily cap.** Most apps let you limit how much can be sent in a day. Keeping it close to what you actually spend is sensible."),
  P("**பணம் பெற UPI PIN தேவையில்லை.** பணம் *பெறுவதற்கு* PIN கேட்கப்பட்டால், அது நிச்சயம் மோசடி. PIN என்பது பணம் அனுப்ப மட்டுமே.","**You never need a PIN to receive money.** If a PIN is asked for to *receive* a payment, it is a scam. The PIN only authorises money going out."),
  P("**தவறான கணக்குக்குச் சென்றுவிட்டால்.** உடனடியாக செயலியின் புகார் பிரிவில் பதிவு செய்து, வங்கியைத் தொடர்பு கொள்ளுங்கள். 24 மணி நேரத்திற்குள் புகாரளித்தால் மீட்பு வாய்ப்பு அதிகம்.","**If it went to the wrong account.** Raise it in the app's dispute section and call your bank straight away; reporting within 24 hours gives the best chance of recovery.")],
 tags:P(["UPI","டிஜிட்டல் பணம்","பாதுகாப்பு"],["UPI","Digital payments","Safety"])},

{id:"villagegames",cat:"sports",mins:880,read:3,sample:true,
 place:P("கடலூர்","Cuddalore"),
 h:P("கிராமப்புற விளையாட்டுகள்: சிலம்பம் முதல் கபடி வரை மீண்டும் களம்","Village games: silambam and kabaddi back on the ground"),
 d:P("பள்ளி மைதானங்களிலும் கிராமத் திடல்களிலும் பாரம்பரிய விளையாட்டுகளுக்கு மீண்டும் ஆர்வம் கூடி வருகிறது.","Traditional games are drawing players back to school grounds and village maidans."),
 body:[
  P("டெல்டா மாவட்டங்களின் கிராமங்களில் சிலம்பம், கபடி, தண்டியடி உள்ளிட்ட பாரம்பரிய விளையாட்டுகளுக்கு இளைஞர்கள் மத்தியில் ஆர்வம் அதிகரித்து வருகிறது.","Across villages in the delta districts, young people are turning back to silambam, kabaddi and other traditional games."),
  P("பண்டிகைக் காலங்களில் நடத்தப்படும் போட்டிகள் பயிற்சிக்கான ஊக்கமாக அமைவதாகப் பயிற்சியாளர்கள் கூறுகின்றனர்.","Coaches say the tournaments held around festival time give players a reason to train through the year."),
  P("மைதான வசதி, பயிற்சியாளர் ஆதரவு மற்றும் மாவட்ட அளவிலான போட்டிகள் அதிகரித்தால் மேலும் பலர் பங்கேற்பார்கள் என்று எதிர்பார்க்கப்படுகிறது.","Better grounds, coaching support and more district-level meets would bring in many more players.")],
 tags:P(["கபடி","சிலம்பம்","கிராமம்"],["Kabaddi","Silambam","Village"])},

{id:"deltacinema",cat:"entertainment",mins:980,read:3,sample:true,
 place:P("செய்திப் பிரிவு","Newsdesk"),
 h:P("உள்ளூர் கதைகள் திரையில்: தமிழ் சினிமாவில் டெல்டா மாவட்டங்களின் இடம்","Local stories on screen: the delta districts in Tamil cinema"),
 d:P("மண்ணின் வாசனையுடன் கூடிய கதைகளும், உள்ளூர் மொழி வழக்கும் திரைப்படங்களில் இடம்பெறுவது அதிகரித்து வருகிறது.","Stories rooted in the soil — and the local idiom that comes with them — are appearing on screen more often."),
 body:[
  P("தமிழ் சினிமாவில் உள்ளூர் மண்ணின் கதைகளுக்கு இடம் அதிகரித்து வருவதை சமீபத்திய படைப்புகள் காட்டுகின்றன.","Recent Tamil films show a growing place for stories drawn from particular places."),
  P("டெல்டா மாவட்டங்களின் வட்டார வழக்கு, வேளாண் வாழ்க்கை மற்றும் நிலத் தொடர்புடைய கதைகள் பார்வையாளர்களைச் சென்றடைகின்றன.","The dialect of the delta districts, farming life and stories tied to the land are finding an audience."),
  P("உள்ளூர் கலைஞர்களுக்கும் இது புதிய வாய்ப்புகளைத் திறந்து வைத்துள்ளது.","It has also opened up work for performers from those districts.")],
 tags:P(["தமிழ் சினிமா","கலாச்சாரம்"],["Tamil cinema","Culture"])},

{id:"districtinfo",cat:"tamil-nadu",mins:1120,read:2,sample:true,
 place:P("செய்திப் பிரிவு","Newsdesk"),
 h:P("மாவட்ட நிர்வாகத் தகவல்களை ஆன்லைனில் பெறுவது எப்படி","How to get district administration information online"),
 d:P("சான்றிதழ்கள், மனுக்கள், மற்றும் குறை தீர்க்கும் கூட்டங்கள் — எந்தத் தளத்தில் என்ன கிடைக்கும் என்பதற்கான சுருக்கம்.","Certificates, petitions and grievance days — a short map of which portal does what."),
 body:[
  P("வருவாய்த் துறை சான்றிதழ்கள் பெரும்பாலானவை tnesevai மையங்கள் மூலமாகவோ இணையதளத்தின் மூலமாகவோ விண்ணப்பிக்கக் கூடியவை.","Most revenue department certificates can be applied for through a tnesevai centre or online."),
  P("மனுக்கள் மற்றும் குறைகளை தமிழ்நாடு அரசின் மக்கள் குறை தீர்க்கும் தளத்தில் பதிவு செய்து, மனு எண் மூலம் நிலையைப் பின்தொடரலாம்.","Petitions and grievances can be filed on the state's public grievance portal, and the status tracked with the petition number."),
  P("விண்ணப்பத்தின் நிலையைக் காட்டும் எண்ணைப் பாதுகாப்பாக வைத்திருப்பது பின்தொடர்வதற்கு உதவும்.","Keeping the reference number safe makes following up much easier.")],
 tags:P(["மாவட்ட நிர்வாகம்","வழிகாட்டி"],["District administration","Guide"])}
];

/* Video-only reports — the channel's own published titles, unedited */
const VIDEOS=[
 {vid:"9pHRmTG7Y-A",cat:"tamil-nadu",mins:150,

function relTime(ts){
  const d=new Date(ts); if(isNaN(d.getTime()))return "";
  const s=Math.max(0,(Date.now()-d.getTime())/1000);
  if(s<90)return t("now");
  const m=Math.round(s/60); if(m<60)return LANG==="ta"?m+" நிமிடங்களுக்கு முன்":m+" min ago";

  const dd=Math.round(h/24); if(dd<8)return LANG==="ta"?dd+" நாட்களுக்கு முன்":dd+(dd===1?" day ago":" days ago");

}

 const storyVids=new Set(STORIES.map(s=>s.vid).filter(Boolean));
 const b=VIDEOS.filter(v=>!storyVids.has(v.vid)).map(v=>({kind:"video",id:v.vid,cat:v.cat,h:v.h,img:v.vid,vid:v.vid,mins:v.mins,series:v.series,href:"#/video/"+v.vid}));
 return a.concat(b).sort((x,y)=>(x.mins||0)-(y.mins||0));
}

function eyebrow(title,color,more,moreHref){
 return `<div class="eyebrow" style="--kc:${color||"var(--accent)"}"><h2>${esc(title)}</h2>`+
  (moreHref?`<a class="more" href="${moreHref}">${esc(more||t("viewAll"))}${chev}</a>`:"")+`</div>`;
}
function adSlot(kind){
 const cfg=kind==="lb"?CONFIG.ads.leaderboard:CONFIG.ads.sidebar;
 if(cfg&&cfg.img)return `<a href="${esc(cfg.href||"#")}" target="_blank" rel="noopener"><img src="${esc(cfg.img)}" alt="${esc(cfg.alt||"")}"></a>`;
 return `<div class="ad ${kind}"><div><div class="l">${esc(t("adSlot"))}</div>`+
  `<div class="s">${esc(kind==="lb"?t("adLead"):t("adSide"))}</div>`+
  `<a class="c" href="#/advertise">${esc(t("adCta"))}</a></div></div>`;
}
function card(i,o){o=o||{};
 const c=CAT(i.cat), has=!!IMG[i.img];
 return `<a class="card${o.wide?" wide":""}${has?"":" txt"}" href="${i.href}">`+
  (has?fig(i.img,{play:!!i.vid,sm:!o.wide,alt:L(i.h)}):"")+
  `<span class="kicker" style="--kc:${c.c}">${esc(L(c))}</span>`+
  `<h3>${esc(L(i.h))}</h3>`+(o.dek&&i.d?`<p class="dek">${esc(L(i.d))}</p>`:"")+dline(i,true,true)+`</a>`;
}
function feedRow(i){
 const c=CAT(i.cat), has=!!IMG[i.img];
 return `<a href="${i.href}"><div class="fi${has?"":" nomed"}"><div>`+
  `<span class="kicker" style="--kc:${c.c}">${esc(L(c))}</span><h3>${esc(L(i.h))}</h3>${dline(i,true,true)}</div>`+
  (has?fig(i.img,{sq:true,play:!!i.vid,sm:true,alt:L(i.h)}):"")+`</div></a>`;
}
function listRow(i){
 const c=CAT(i.cat);
 return `<a href="${i.href}">${IMG[i.img]?fig(i.img,{sq:true,play:!!i.vid,sm:true,alt:L(i.h)}):`<div class="fig sq ph"></div>`}`+
  `<div><span class="kicker" style="--kc:${c.c}">${esc(L(c))}</span><h3>${esc(L(i.h))}</h3>${dline(i,false,true)}</div></a>`;

function indexBlock(title,list){
 return `<div class="rblk">${eyebrow(title,"var(--accent)")}<div class="index">`+
  list.map((i,n)=>`<a href="${i.href}" style="--kc:${CAT(i.cat).c}"><span class="n tnum">${n+1}</span><h4>${esc(L(i.h))}</h4></a>`).join("")+
  `</div></div>`;
}
function livePanel(){
 return `<a class="lvpanel" href="#/live"><span class="lvtop"><span>${esc(t("live"))}</span></span>`+
  `<h3>${esc(t("liveNow"))}</h3><p>${esc(t("liveDesc"))}</p>`+
  `<span class="ln">${esc(t("watchLive"))}${chev}</span></a>`;
}
function emptyBox(title,desc,href,label){
 return `<div class="empty"><div class="ln"></div><h3>${esc(title)}</h3><p>${esc(desc)}</p>`+
  (href?`<a class="btn btn-a" href="${href}" ${/^https?:/.test(href)?'target="_blank" rel="noopener"':""}>${esc(label)}</a>`:"")+`</div>`;
}
function socLinks(){
 const s=CONFIG.site,o=[];
 if(s.youtube)o.push(`<a href="${s.youtube}" target="_blank" rel="noopener" aria-label="YouTube">${sv("yt")}</a>`);
 if(s.facebook)o.push(`<a href="${s.facebook}" target="_blank" rel="noopener" aria-label="Facebook">${sv("fb")}</a>`);
 if(s.instagram)o.push(`<a href="${s.instagram}" target="_blank" rel="noopener" aria-label="Instagram">${sv("ig")}</a>`);
 if(s.whatsapp)o.push(`<a href="https://wa.me/${s.whatsapp}" target="_blank" rel="noopener" aria-label="WhatsApp">${sv("wa")}</a>`);
 if(s.telegram)o.push(`<a href="https://t.me/${s.telegram}" target="_blank" rel="noopener" aria-label="Telegram">${sv("tg")}</a>`);
 return o.join("");
}
function videoBlock(vid,title){
 if(CAN_EMBED)return `<div class="thr"><div style="aspect-ratio:16/9"><iframe src="https://www.youtube-nocookie.com/embed/${esc(vid)}" title="${esc(title)}" style="width:100%;height:100%;border:0;display:block" allow="accelerometer;autoplay;clipboard-write;encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe></div></div>`;
 return `<a class="thr" style="display:block" href="https://www.youtube.com/watch?v=${esc(vid)}" target="_blank" rel="noopener">`+
  `<div style="position:relative">${IMG[vid]?`<img src="${IMG[vid]}" alt="" style="width:100%;aspect-ratio:16/9;object-fit:cover">`:`<div class="scr"></div>`}<span class="pl"><i style="width:62px;height:62px"></i></span></div>`+
  `<div class="thrbar"><span style="color:var(--live);display:grid">${sv("yt")}</span><span class="t">${esc(title||"")}</span><span class="s">YouTube ↗</span></div></a>`;
}
</script>

  </div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   NEWSROOM — auth, articles, media
   Talks to Supabase over plain fetch. No SDK, no CDN script: one less thing
   that can fail to load and take the admin panel down with it.

   The key below is the PUBLISHABLE key. It is meant to be public. What
   actually protects your data is row level security in the database:
   visitors can read published articles and nothing else, and only a
   signed-in account on the allow-list can write.
   ═══════════════════════════════════════════════════════════════════════ */
const SB={
 url:"", key:"", token:null, refresh:null, user:null, role:null,
 ready(){return !!(this.url&&this.key)},
 save(){try{
   if(this.token)localStorage.setItem("vt-sess",JSON.stringify({t:this.token,r:this.refresh}));
   else localStorage.removeItem("vt-sess");
 }catch(e){}},
 load(){try{
   const s=JSON.parse(localStorage.getItem("vt-sess")||"null");
   if(s&&s.t){this.token=s.t;this.refresh=s.r}
 }catch(e){}},

 async raw(path,opt,useToken){
  opt=opt||{};
  const h=Object.assign({apikey:this.key},opt.headers||{});
  if(!h["content-type"]&&opt.body&&typeof opt.body==="string")h["content-type"]="application/json";
  h.Authorization="Bearer "+((useToken!==false&&this.token)?this.token:this.key);
  const res=await fetch(this.url+path,Object.assign({},opt,{headers:h}));
  return res;
 },
 async api(path,opt,retry){
  let res=await this.raw(path,opt);
  if(res.status===401&&this.refresh&&retry!==false){
   if(await this.doRefresh())res=await this.raw(path,opt);
  }
  const txt=await res.text();
  let body=null; try{body=txt?JSON.parse(txt):null}catch(e){body=txt}
  if(!res.ok){
   const msg=(body&&(body.message||body.error_description||body.error||body.msg))||("HTTP "+res.status);
   throw new Error(String(msg));
  }
  return body;
 },
 async doRefresh(){
  try{
   const r=await fetch(this.url+"/auth/v1/token?grant_type=refresh_token",{
     method:"POST",headers:{apikey:this.key,"content-type":"application/json"},
     body:JSON.stringify({refresh_token:this.refresh})});
   if(!r.ok)throw 0;
   const j=await r.json();
   this.token=j.access_token; this.refresh=j.refresh_token; this.user=j.user||this.user;
   this.save(); return true;
  }catch(e){ this.token=null;this.refresh=null;this.user=null;this.save(); return false }
 },
 async signIn(email,password){
  const r=await fetch(this.url+"/auth/v1/token?grant_type=password",{
    method:"POST",headers:{apikey:this.key,"content-type":"application/json"},
    body:JSON.stringify({email:email,password:password})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Sign in failed");
  this.token=j.access_token; this.refresh=j.refresh_token; this.user=j.user; this.save();
  await this.whoami(); return true;
 },
 async signUp(email,password){
  const r=await fetch(this.url+"/auth/v1/signup",{
    method:"POST",headers:{apikey:this.key,"content-type":"application/json"},
    body:JSON.stringify({email:email,password:password})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.msg||j.error_description||j.message||"Could not create the account");
  if(j.access_token){
   this.token=j.access_token; this.refresh=j.refresh_token; this.user=j.user; this.save();
   await this.whoami(); return "in";
  }
  return "confirm";   /* project requires email confirmation */
 },
 async signOut(){
  try{await this.raw("/auth/v1/logout",{method:"POST"})}catch(e){}
  this.token=null;this.refresh=null;this.user=null;this.role=null;this.save();
 },
 async whoami(){
  if(!this.token)return null;
  try{
   const u=await this.api("/auth/v1/user",{});
   this.user=u;
   const p=await this.api("/rest/v1/profiles?select=role,full_name,email&id=eq."+encodeURIComponent(u.id),{});
   this.role=(p&&p[0]&&p[0].role)||null;
   return u;
  }catch(e){ this.token=null;this.refresh=null;this.save(); return null }
 },
 isStaff(){return this.role==="admin"||this.role==="editor"},

 /* ── articles ── */
 sel:"id,slug,category,title_ta,title_en,dek_ta,dek_en,body_ta,body_en,quote_ta,quote_en,"
    +"place_ta,place_en,hero_url,video_id,tags,is_lead,status,published_at,updated_at",
 listPublished(n){return this.api("/rest/v1/articles?select="+this.sel
   +"&status=eq.published&order=published_at.desc&limit="+(n||40),{},false)},
 listAll(){return this.api("/rest/v1/articles?select="+this.sel+"&order=updated_at.desc&limit=200",{})},
 create(row){return this.api("/rest/v1/articles",{method:"POST",
   headers:{Prefer:"return=representation"},body:JSON.stringify(row)})},
 update(id,row){return this.api("/rest/v1/articles?id=eq."+encodeURIComponent(id),{method:"PATCH",
   headers:{Prefer:"return=representation"},body:JSON.stringify(row)})},
 remove(id){return this.api("/rest/v1/articles?id=eq."+encodeURIComponent(id),{method:"DELETE"})},
 getSettings(){return this.api("/rest/v1/settings?select=value&key=eq.site",{},false)},
 saveSettings(v){return this.api("/rest/v1/settings?key=eq.site",{method:"PATCH",
   headers:{Prefer:"return=representation"},body:JSON.stringify({value:v})})},

 /* ── media ── */
 async upload(file){
  const clean=(file.name||"image").toLowerCase().replace(/[^a-z0-9.]+/g,"-").replace(/^-|-$/g,"");
  const path=new Date().toISOString().slice(0,10)+"/"+Date.now()+"-"+clean;
  const res=await this.raw("/storage/v1/object/media/"+path,{method:"POST",
    headers:{"content-type":file.type||"application/octet-stream","x-upsert":"true"},body:file});
  if(!res.ok){
   const t=await res.text().catch(()=>"");
   throw new Error("Upload failed: "+(t||res.status));
  }
  return this.url+"/storage/v1/object/public/media/"+path;
 }
};

/* ── database row ⇄ the shape the site already renders ── */
function splitParas(s){return String(s||"").split(/\n{2,}/).map(x=>x.trim()).filter(Boolean)}
function rowToStory(r){
 const pa=splitParas(r.body_ta), pe=splitParas(r.body_en);
 const when=new Date(r.published_at||r.updated_at||Date.now());
 if(r.hero_url)IMG["db_"+r.slug]=r.hero_url;
 return {
  id:r.slug, cat:r.category, lead:!!r.is_lead, dbId:r.id, status:r.status,
  h:{ta:r.title_ta||"",en:r.title_en||r.title_ta||""},
  d:{ta:r.dek_ta||"",en:r.dek_en||r.dek_ta||""},
  body:pa.map((p,i)=>({ta:p,en:pe[i]||p})),
  quote:r.quote_ta?{ta:r.quote_ta,en:r.quote_en||r.quote_ta}:null,
  place:{ta:r.place_ta||"",en:r.place_en||r.place_ta||""},
  tags:{ta:r.tags||[],en:r.tags||[]},
  img:r.hero_url?("db_"+r.slug):(r.video_id||""),
  vid:r.video_id||"",
  mins:Math.max(1,Math.round((Date.now()-when.getTime())/60000)),
  read:Math.max(1,Math.round((r.body_ta||"").length/900))
 };
}
function storyToRow(s){
 return {slug:s.id,category:s.cat,title_ta:s.h.ta,title_en:s.h.en,
  dek_ta:s.d?s.d.ta:null,dek_en:s.d?s.d.en:null,
  body_ta:(s.body||[]).map(p=>p.ta).join("\n\n")||null,
  body_en:(s.body||[]).map(p=>p.en).join("\n\n")||null,
  quote_ta:s.quote?s.quote.ta:null,quote_en:s.quote?s.quote.en:null,
  place_ta:s.place?s.place.ta:null,place_en:s.place?s.place.en:null,
  video_id:s.vid||null,tags:(s.tags&&s.tags.ta)||[],is_lead:!!s.lead,
  status:"published",published_at:new Date(Date.now()-(s.mins||0)*60000).toISOString()};
}

const DB={loaded:false,ok:false,count:0,error:null};
async function loadArticles(){
 if(!SB.ready()){DB.error="Supabase not configured";return false}
 try{
  const rows=await SB.listPublished(40);
  DB.loaded=true; DB.count=(rows||[]).length;
  if(!rows||!rows.length){DB.error="no published articles yet";DB.ok=false;return false}
  STORIES.length=0;
  rows.forEach(r=>STORIES.push(rowToStory(r)));
  if(!STORIES.some(s=>s.lead))STORIES[0].lead=true;
  DB.ok=true; DB.error=null; return true;
 }catch(e){
  DB.error=String(e&&e.message||e);
  console.warn("[vannatamil] newsroom unreachable — built-in stories shown.",e);
  return false;
 }
}
async function loadSiteSettings(){
 if(!SB.ready())return;
 try{
  const r=await SB.getSettings();
  const v=(r&&r[0]&&r[0].value)||{};
  if(v.epaper_url)CONFIG.epaper.latestPdfUrl=v.epaper_url;
  if(v.epaper_date)CONFIG.epaper.editionDate=v.epaper_date;
  if(v.live_video_id)CONFIG.youtube.liveVideoId=v.live_video_id;
  if(v.ad_leaderboard)CONFIG.ads.leaderboard=v.ad_leaderboard;
  if(v.ad_sidebar)CONFIG.ads.sidebar=v.ad_sidebar;
 }catch(e){}
}

<script>

function slugify(s){

 return (/^[a-z0-9-]+$/.test(base)&&base) ? base.slice(0,60) : "post-"+Date.now().toString(36);
}
function admNote(){

/* ── handlers ── */
async function refreshAdmin(){
 try{ADM.rows=(await SB.listAll())||[]}catch(e){ADM.rows=[];ADM.msg=String(e.message||e);ADM.kind="err"}
 try{const s=await SB.getSettings();ADM.settings=(s&&s[0]&&s[0].value)||{}}catch(e){}
 ADM.loaded=true;
}
function readForm(){
 const g=id=>{const e=$("#"+id);return e?String(e.value||"").trim():""};
 const title=g("f-tta");
 return {
  slug:g("f-slug")||slugify(g("f-ten")||title),
  category:CATIDS.indexOf(g("f-cat"))>=0?g("f-cat"):CATIDS[0],
  title_ta:title, title_en:g("f-ten")||null,
  dek_ta:g("f-dta")||null, dek_en:g("f-den")||null,
  body_ta:g("f-bta")||null, body_en:g("f-ben")||null,
  quote_ta:g("f-qta")||null, quote_en:g("f-qen")||null,
  place_ta:g("f-place")||null, place_en:g("f-placeen")||null,
  hero_url:g("f-hero")||null, video_id:g("f-vid")||null,
  tags:g("f-tags")?g("f-tags").split(",").map(x=>x.trim()).filter(Boolean):[],
  is_lead:!!($("#f-lead")&&$("#f-lead").checked)
 };
}
async function saveArticle(status){
 if(ADM.busy)return;
 const idEl=$("#f-id"), id=idEl?idEl.value:"";
 const row=readForm();
 if(!row.title_ta){say(t("needTitle"),"err");return}
 row.status=status;
 if(status==="published")row.published_at=new Date().toISOString();
 ADM.busy=true;
 try{
  /* only one lead story at a time */
  if(row.is_lead)await SB.api("/rest/v1/articles?is_lead=eq.true",{method:"PATCH",body:JSON.stringify({is_lead:false})});
  if(id)await SB.update(id,row); else await SB.create(row);
  await refreshAdmin(); await loadArticles();
  location.hash="#/admin";
  ADM.msg=status==="published"?t("savedLive"):t("savedDraft"); ADM.kind="good";
  paintChrome(); route();
 }catch(e){ say(String(e.message||e),"err") }
 finally{ ADM.busy=false }
}
async function deleteArticle(id){
 try{ await SB.remove(id); await refreshAdmin(); await loadArticles();
      location.hash="#/admin"; ADM.msg=t("deleted"); ADM.kind="good"; paintChrome(); route(); }
 catch(e){ say(String(e.message||e),"err") }
}
async function importStarters(){
 if(ADM.busy)return; ADM.busy=true;
 try{
  const rows=STORIES.map(storyToRow);
  await SB.create(rows);
  await refreshAdmin(); await loadArticles();
  ADM.msg=t("imported"); ADM.kind="good"; paintChrome(); route();
 }catch(e){ say(String(e.message||e),"err") }
 finally{ ADM.busy=false }
}
function bindAdmin(){
 const form=$("#loginform");
 if(form)form.addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=$("#lg-go"); if(btn){btn.disabled=true;btn.textContent="…"}
  try{
   const em=$("#lg-email").value.trim(), pw=$("#lg-pass").value;
   if(ADM.signup){
    const r=await SB.signUp(em,pw);
    if(r==="confirm"){ ADM.signup=false; ADM.msg=t("checkEmail"); ADM.kind="good"; route(); return }
   }else{
    await SB.signIn(em,pw);
   }
   await refreshAdmin(); ADM.msg=null; ADM.signup=false; paintChrome(); route();
  }catch(err){ ADM.msg=String(err.message||err); ADM.kind="err"; route() }
 });

 document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",async()=>{
  const a=b.getAttribute("data-act");
  if(a==="togglesignup"){ ADM.signup=!ADM.signup; ADM.msg=null; route(); }
  if(a==="signout"){ await SB.signOut(); ADM.rows=[]; ADM.loaded=false; location.hash="#/"; paintChrome(); route(); }
  if(a==="import")  importStarters();
  if(a==="publish") saveArticle("published");
  if(a==="draft")   saveArticle("draft");
  if(a==="pickhero")$("#f-herofile").click();
  if(a==="clearhero"){ $("#f-hero").value=""; $("#f-heroimg").style.display="none"; $("#f-heroname").textContent=t("noImage"); }
  if(a==="savesettings"){
   try{
    const v=Object.assign({},ADM.settings||{},{
      epaper_url:$("#s-ep").value.trim(), epaper_date:$("#s-epd").value.trim(),
      live_video_id:$("#s-live").value.trim()});
    await SB.saveSettings(v); ADM.settings=v; await loadSiteSettings();
    ADM.msg=t("savedLive"); ADM.kind="good"; route();
   }catch(e){ say(String(e.message||e),"err") }
  }
 }));

 const fileEl=$("#f-herofile");
 if(fileEl)fileEl.addEventListener("change",async()=>{
  const f=fileEl.files&&fileEl.files[0]; if(!f)return;
  $("#f-heroname").textContent=t("uploading");
  try{
   const url=await SB.upload(f);
   $("#f-hero").value=url;
   $("#f-heroimg").src=url; $("#f-heroimg").style.display="";
   $("#f-heroname").textContent=f.name;
  }catch(e){ $("#f-heroname").textContent=String(e.message||e) }
 });

 /* two-step delete — no browser confirm dialog to get stuck behind */
 document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
  if(b.getAttribute("data-armed")){ deleteArticle(b.getAttribute("data-del")); return }
  const was=b.textContent;
  b.setAttribute("data-armed","1"); b.textContent=t("confirmDel"); b.style.borderColor="var(--live)"; b.style.color="var(--live)";
  setTimeout(()=>{ if(b.isConnected&&b.getAttribute("data-armed")){
    b.removeAttribute("data-armed"); b.textContent=was; b.style.borderColor=""; b.style.color=""; } },4000);
 }));
}
</script>

<script>
/* ═══════════ SOCIAL WALL ═══════════
   One request to your connector returns YouTube + Facebook + Instagram already
   merged and sorted. Tokens stay on the server; this only ever sees the JSON. */
const SRC={
 youtube:{n:"YouTube", c:"var(--live)",      i:"yt"},
 facebook:{n:"Facebook",c:"var(--c-cyan)",   i:"fb"},
 instagram:{n:"Instagram",c:"var(--c-magenta)",i:"ig"}
};
const SOCIAL={tried:false,ok:false,posts:[],sources:{},updated:null,error:null};

async function loadSocial(){
 const ep=CONFIG.feed&&CONFIG.feed.endpoint;
 SOCIAL.tried=true;
 if(!ep){SOCIAL.error="endpoint not configured";return false}
 try{
  const bust=Math.floor(Date.now()/60000);
  const r=await fetch(ep+(ep.indexOf("?")<0?"?":"&")+"t="+bust,{headers:{accept:"application/json"}});
  const j=await r.json();
  SOCIAL.posts=Array.isArray(j.posts)?j.posts:[];
  SOCIAL.sources=j.sources||{}; SOCIAL.updated=j.updated||null;
  SOCIAL.error=j.error||null; SOCIAL.ok=SOCIAL.posts.length>0;
  /* the connector already fetched YouTube — reuse it for the video sections
     so the whole site runs off one request instead of three */
  const yt=SOCIAL.posts.filter(p=>p.source==="youtube"&&p.videoId);
  if(yt.length){
   VIDEOS.length=0;
   yt.forEach(p=>{
    if(p.image)IMG[p.videoId]=p.image;
    const pub=new Date(p.published);
    const mins=isNaN(pub.getTime())?0:Math.max(1,Math.round((Date.now()-pub.getTime())/60000));
    VIDEOS.push({vid:p.videoId,cat:"district",mins:mins,h:{ta:p.title,en:p.title}});
   });
   FEED.yt={ok:true,why:yt.length+" videos via connector"};
  }
  return SOCIAL.ok;
 }catch(e){
  SOCIAL.error=String(e&&e.message||e);
  console.warn("[vannatamil] social feed unavailable — follow cards shown instead.",e);
  return false;
 }
}

function sTile(p){
 const m=SRC[p.source]||SRC.youtube;
 const img=p.image?`<div class="fig sq"><img src="${esc(p.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`+
   (p.type==="video"?`<span class="pl sm"><i></i></span>`:"")+`<span class="badge">${sv(m.i)}</span></div>`
   :`<div class="fig sq ph"><span class="badge">${sv(m.i)}</span></div>`;
 const txt=(p.title||p.text||"").replace(/\s+/g," ").trim();
 return `<a class="stile" href="${esc(p.url)}" target="_blank" rel="noopener" data-src="${esc(p.source)}">`+
  img+`<span class="kicker" style="--kc:${m.c}">${esc(m.n)}</span>`+
  `<p>${esc(txt.slice(0,170))}${txt.length>170?"…":""}</p>`+
  `<span class="dline tnum">${esc(relTime(p.published))}</span></a>`;
}
const WALL={f:"all",n:24};
function wallHTML(){
 const list=SOCIAL.posts.filter(p=>WALL.f==="all"||p.source===WALL.f);
 const shown=list.slice(0,WALL.n);
 return `<div class="wall" id="wall">${shown.map(sTile).join("")}</div>`+
  (list.length>shown.length?`<div class="morerow"><button class="btn" type="button" data-more="wall">${esc(t("loadMore"))}<span class="tnum" style="opacity:.55;margin-inline-start:6px">${shown.length} / ${list.length}</span></button></div>`:"");
}
function feedStatus(){
 const live=SOCIAL.ok;
 const counts=Object.keys(SRC).filter(k=>SOCIAL.sources[k]&&SOCIAL.sources[k].ok)
   .map(k=>SRC[k].n+" "+SOCIAL.sources[k].count);
 return `<div class="fstat"><i class="${live?"":"bad"}"></i>`+
  `<span>${esc(live?t("liveFeed"):t("feedOff"))}</span>`+
  (counts.length?`<span class="sep"></span><span>${esc(counts.join(" · "))}</span>`:"")+
  (SOCIAL.updated?`<span class="sep"></span><span class="tnum">${esc(t("updatedAt"))} ${esc(relTime(SOCIAL.updated))}</span>`:"")+
  `</div>`;
}

/* ═══════════ FEEDS ═══════════ */
const FEED={yt:{ok:false,why:"not configured"},fb:{ok:false,why:"not configured"}};
async function loadYouTube(){
 const y=CONFIG.youtube;
 if(!y.apiKey||!y.channelId){FEED.yt={ok:false,why:"no API key / channel id"};return false}
 try{
  const u="https://www.googleapis.com/youtube/v3/search?key="+encodeURIComponent(y.apiKey)+
    "&channelId="+encodeURIComponent(y.channelId)+"&part=snippet&order=date&type=video&maxResults="+(y.maxResults||12);
  const r=await fetch(u); if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json(); if(j.error)throw new Error(j.error.message||"API error");
  const live=(j.items||[]).filter(i=>i.id&&i.id.videoId).map(i=>{
   const sn=i.snippet||{},pub=new Date(sn.publishedAt);
   const mins=isNaN(pub.getTime())?0:Math.max(1,Math.round((Date.now()-pub.getTime())/60000));
   const title=(sn.title||"").replace(/^\s*🔴?\s*LIVE\s*[:|-]?\s*/i,"").trim();
   const th=((sn.thumbnails&&(sn.thumbnails.high||sn.thumbnails.medium||sn.thumbnails.default))||{}).url;
   if(th)IMG[i.id.videoId]=th;
   return {vid:i.id.videoId,cat:"district",mins:mins,h:{ta:title,en:title}};
  });
  if(live.length){VIDEOS.length=0;VIDEOS.push.apply(VIDEOS,live)}
  FEED.yt={ok:true,why:live.length+" videos"};return true;
 }catch(e){FEED.yt={ok:false,why:String(e&&e.message||e)};console.warn("[vannatamil] YouTube feed unavailable — seeded content shown.",e);return false}
}
async function loadFacebook(){
 const f=CONFIG.facebook;
 if(!f.accessToken||!f.pageId){FEED.fb={ok:false,why:"no page token"};return false}
 try{
  const u="https://graph.facebook.com/v21.0/"+encodeURIComponent(f.pageId)+
    "/posts?fields=message,full_picture,permalink_url,created_time&limit="+(f.limit||6)+"&access_token="+encodeURIComponent(f.accessToken);
  const j=await (await fetch(u)).json(); if(j.error)throw new Error(j.error.message||"Graph error");
  FEED.fb={ok:true,why:(j.data||[]).length+" posts",posts:j.data||[]};return true;
 }catch(e){FEED.fb={ok:false,why:String(e&&e.message||e)};console.warn("[vannatamil] Facebook feed unavailable — follow links shown.",e);return false}
}
function followCards(){
 const s=CONFIG.site;
 return [
  s.youtube&&["yt","YouTube",LANG==="ta"?"வீடியோ செய்திகள் மற்றும் நேரலை":"Video reports and live streams",s.youtube],
  s.facebook&&["fb","Facebook",LANG==="ta"?"பக்கத்தைப் பின்தொடருங்கள்":"Follow the page",s.facebook],
  s.instagram&&["ig","Instagram",LANG==="ta"?"புகைப்படங்கள் மற்றும் ரீல்ஸ்":"Photos and reels",s.instagram],
  s.whatsapp&&["wa","WhatsApp",LANG==="ta"?"உடனடி அப்டேட்கள்":"Instant updates","https://wa.me/"+s.whatsapp],
  s.telegram&&["tg","Telegram",LANG==="ta"?"சேனலில் இணையுங்கள்":"Join the channel","https://t.me/"+s.telegram]
 ].filter(Boolean).map(([ic,n,d,href])=>`<a href="${href}" target="_blank" rel="noopener" style="border-top:1px solid var(--ink);padding-top:16px">
   <span style="color:var(--accent);display:inline-grid">${sv(ic)}</span>
   <h3 style="font-size:18px;margin-block:12px 6px">${esc(n)}</h3>
   <p style="color:var(--muted);font-size:14px;line-height:1.6">${esc(d)}</p></a>`).join("");
}

/* direct-key mode: build the wall from whatever the client-side calls returned.
   Only runs when a real key actually answered — seeded demo content must never
   be dressed up as a live feed. */
function socialFromDirect(){
 if(!FEED.yt.ok&&!FEED.fb.ok)return false;
 const out=[];
 if(FEED.yt.ok)VIDEOS.forEach(v=>out.push({
   id:"yt_"+v.vid,source:"youtube",type:"video",videoId:v.vid,
   url:"https://www.youtube.com/watch?v="+v.vid,image:IMG[v.vid]||"",
   title:L(v.h),text:"",published:new Date(Date.now()-(v.mins||0)*60000).toISOString()}));
 if(FEED.fb.ok&&FEED.fb.posts)FEED.fb.posts.forEach(p=>out.push({
   id:"fb_"+p.id,source:"facebook",type:p.full_picture?"image":"text",
   url:p.permalink_url||CONFIG.site.facebook,image:p.full_picture||"",
   title:"",text:p.message||"",published:p.created_time||null}));
 if(!out.length)return false;
 out.sort((a,b)=>new Date(b.published||0)-new Date(a.published||0));
 SOCIAL.posts=out; SOCIAL.ok=true; SOCIAL.updated=new Date().toISOString();
 SOCIAL.sources={
   youtube:FEED.yt.ok?{ok:true,count:VIDEOS.length}:{ok:false,error:FEED.yt.why},
   facebook:FEED.fb.ok?{ok:true,count:(FEED.fb.posts||[]).length}:{ok:false,error:FEED.fb.why},
   instagram:{ok:false,error:"needs the server connector"}};
 return true;
}

/* ═══════════ CHROME ═══════════ */
function paintChrome(){
 const s=CONFIG.site;
 document.documentElement.lang=LANG;
 $("#pl-logo").src=IMG.logo.d; $("#f-logo").src=IMG.logo.d;
 $("#u-date").textContent=(window.innerWidth<620?fmtDate:fmtLong)(new Date());
 $("#u-ep").textContent=t("epaper"); $("#u-ad").textContent=t("advertise"); $("#u-ct").textContent=t("contact");
 $("#u-sw").textContent=t("wall");
 $("#u-soc").innerHTML=socLinks(); $("#f-soc").innerHTML=socLinks();
 $("#t-lang").textContent=LANG==="ta"?"English":"தமிழ்";
 $("#pl-place").textContent=LANG==="ta"?"விருத்தாசலம், தமிழ்நாடு":"Vriddhachalam, Tamil Nadu";
 $("#pl-since").textContent=LANG==="ta"?"தமிழ் டிஜிட்டல் செய்தி · 2021 முதல்":"Tamil digital news · since 2021";
 $("#pl-live").textContent=t("live");
 $("#st-label").textContent=t("breaking");
 $("#q").placeholder=t("searchPh");
 $("#d-t").textContent=t("sections");

 $("#nav").innerHTML=`<a class="navl" href="#/" data-r="/">${esc(t("home"))}</a>`+
  CATS.map(c=>`<a class="navl" href="#/category/${c.id}" data-r="/category/${c.id}" style="--nc:${c.c}">${esc(L(c))}</a>`).join("")+
  `<a class="navl" href="#/videos" data-r="/videos" style="--nc:var(--live)">${esc(t("videos"))}</a>`+
  `<a class="navl" href="#/live" data-r="/live" style="--nc:var(--live)">${esc(t("liveTv"))}</a>`+
  `<a class="navl" href="#/epaper" data-r="/epaper">${esc(t("epaper"))}</a>`;

 $("#dnav").innerHTML=CATS.map(c=>`<a class="dl" href="#/category/${c.id}" style="--kc:${c.c}">${esc(L(c))}</a>`).join("")+
  `<div class="dsec">${esc(t("newsroom"))}</div>`+
  [["#/videos",t("videos")],["#/live",t("liveTv")],["#/epaper",t("epaper")],["#/social",t("wall")]].map(([h,x])=>`<a class="dl" href="${h}" style="--kc:var(--live)">${esc(x)}</a>`).join("")+
  `<div class="dsec">${esc(t("company"))}</div>`+
  [["#/about",t("about")],["#/advertise",t("advertise")],["#/contact",t("contact")]].map(([h,x])=>`<a class="dl" href="${h}" style="--kc:var(--muted)">${esc(x)}</a>`).join("");

 fitNav();
 const tk=items().slice(0,9).map(i=>`<a class="strip-i" href="${i.href}" style="--kc:${CAT(i.cat).c}"><b>${esc(L(CAT(i.cat)))}</b>${esc(L(i.h))}</a>`).join("");
 $("#st-track").innerHTML=tk+tk;

 $("#f-ab").textContent=LANG==="ta"
  ?"தமிழ் மக்களுக்குத் துல்லியமான, விரைவான, தாக்கம் கொண்ட செய்திகளை வழங்கும் டிஜிட்டல் தளம். "+s.company+" நிறுவனம் வழிநடத்துகிறது."
  :"A digital news platform bringing Tamil readers accurate, fast and consequential reporting. Run by "+s.company+".";
 $("#f-t1").textContent=t("sections"); $("#f-t2").textContent=t("newsroom"); $("#f-t3").textContent=t("contact");
 $("#f-cats").innerHTML=CATS.map(c=>`<a href="#/category/${c.id}">${esc(L(c))}</a>`).join("");
 $("#f-links").innerHTML=[["#/videos",t("videos")],["#/live",t("liveTv")],["#/epaper",t("epaper")],["#/social",t("wall")],["#/about",t("about")],["#/advertise",t("advertise")]].map(([h,x])=>`<a href="${h}">${esc(x)}</a>`).join("");
 $("#f-contact").innerHTML=
  `<div><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICO.mail}</svg><a href="mailto:${s.email}">${s.email}</a></div>`+
  `<div><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICO.phone}</svg><a href="tel:+${s.phoneRaw}">${s.phone}</a></div>`+
  `<div><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICO.pin}</svg><span>${esc(LANG==="ta"?s.addressTa:s.address)}</span></div>`;
 $("#f-copy").textContent=`© ${new Date().getFullYear()} ${s.name} · ${s.company}`;
 $("#f-pp").textContent=t("privacy"); $("#f-tos").textContent=t("terms"); $("#f-adm").textContent=t("admin");
 $("#fab").innerHTML=(s.whatsapp?`<a class="wa" href="https://wa.me/${s.whatsapp}" target="_blank" rel="noopener">${sv("wa")}<span>${esc(t("joinWa"))}</span></a>`:"")+
  (s.telegram?`<a class="tg" href="https://t.me/${s.telegram}" target="_blank" rel="noopener">${sv("tg")}<span>${esc(t("joinTg"))}</span></a>`:"");
